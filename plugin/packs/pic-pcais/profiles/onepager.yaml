profile_id: pic-pcais.onepager
# Audience voice profiles for project-onepager under the PIC/PCAIS pack.

audiences:
  funder:
    tone: formal, deliverable-forward, no colloquialisms
    leads_with: milestone progress against the funded plan
    must_include:
      - milestone table with percent_complete and due dates
      - technical_progress narrative language (reuse the milestones' own wording)
      - next claim window reference when within 45 days
    must_omit:
      - internal cost breakdowns beyond claimed amounts
      - people-level attribution (roles only)
      - risk language beyond the register's own wording
    provenance: footnotes         # chips read too informal for funder docs
    format: html+pdf              # docx on request via project-funder-reporting tooling
    signoff_required: [project-lead]

  steering-committee:
    tone: candid, decision-forward
    leads_with: decisions owed and gate status
    must_include: [phase-gate status, risk register movement, decisions owed]
    must_omit: []
    provenance: chips
    format: html+pdf
    signoff_required: [project-lead]

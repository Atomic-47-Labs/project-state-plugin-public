# Merge into project-state/manifest.yaml to enable the tender capability.
capabilities:
  tender-intelligence:
    enabled: true
    version: "1.0.0"
    pack: tender-pursuit                     # pack supplying notifier/review-meeting profiles
    mailbox_label: "tenders/<project-slug>"  # Gmail label routed to this facility
    sources:
      canadabuys:
        feed: true          # RSS/Atom discovery + watch feeds
        email: true
        feeds:
          discovery: []     # list of saved-search Atom/RSS URLs
          watch: []         # per-notice feeds added by tender-monitor
      merx:
        email: true
      sasktenders:
        email: true
        listing: true
        listing_interval_hours: 4
      gem:
        listing: true
        listing_interval_hours: 4
      bidsandtenders:
        email: true
        listing: true
        listing_interval_hours: 4
        search_urls: []     # approved public search URLs only
    profiles_enabled: []    # tender-profile ids active in this facility; empty = all in tenders/profiles/
